name: Golden Oracle Regression Gate

on:
  schedule:
    # Bounded autonomous learning only: one health probe, one canary, one rotating question.
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      max_questions:
        description: 'Maximum autonomous learning questions (hard max 2)'
        required: true
        default: '2'
      request_timeout_seconds:
        description: 'Per-question timeout seconds (hard max 15)'
        required: true
        default: '15'

permissions:
  contents: read

concurrency:
  group: golden-oracle-autonomous-learning-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bounded-autonomous-learning:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout codebase
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Enforce bounded autonomous policy
        run: |
          MAX_QUESTIONS="${{ github.event.inputs.max_questions || '2' }}"
          REQUEST_TIMEOUT_SECONDS="${{ github.event.inputs.request_timeout_seconds || '15' }}"
          if [ "$MAX_QUESTIONS" -gt 2 ]; then
            echo "::error::CONFIGURATION_FAILURE: max_questions must be <= 2"
            exit 1
          fi
          if [ "$REQUEST_TIMEOUT_SECONDS" -gt 15 ]; then
            echo "::error::CONFIGURATION_FAILURE: request_timeout_seconds must be <= 15"
            exit 1
          fi
          echo "MAX_QUESTIONS=$MAX_QUESTIONS" >> "$GITHUB_ENV"
          echo "REQUEST_TIMEOUT_SECONDS=$REQUEST_TIMEOUT_SECONDS" >> "$GITHUB_ENV"
          echo "ORACLE_RETRIES=0" >> "$GITHUB_ENV"
          echo "MAX_HEALTH_PROBES=1" >> "$GITHUB_ENV"
          echo "CANARY_QUESTIONS=1" >> "$GITHUB_ENV"
          echo "ROTATING_LEARNING_QUESTIONS=1" >> "$GITHUB_ENV"

      - name: Verify autonomous schema migration readiness
        run: |
          if ! grep -q "autonomous_learning_record_versions" backend/migrations/20260616_autonomous_learning.sql; then
            echo "::error::MIGRATION_NOT_READY: version history table missing"
            exit 1
          fi
          if ! grep -q "enable row level security" backend/migrations/20260616_autonomous_learning.sql; then
            echo "::error::MIGRATION_NOT_READY: RLS policy missing"
            exit 1
          fi
          if grep -q "references wiki_entries" backend/migrations/20260616_autonomous_learning.sql; then
            echo "::error::MIGRATION_NOT_READY: wiki_entries coupling forbidden"
            exit 1
          fi

      - name: Single backend health probe
        run: |
          python - <<'PY'
          import os, sys, urllib.request
          url = os.environ.get("ORACLE_BACKEND_URL", "https://mat-the-website.onrender.com").rstrip("/") + "/"
          try:
              with urllib.request.urlopen(url, timeout=15) as resp:
                  if resp.status >= 500:
                      raise SystemExit("backend_5xx")
          except Exception as exc:
              print(f"::error::BACKEND_UNSTABLE: {exc}")
              sys.exit(1)
          PY

      - name: Run bounded autonomous learning loop
        id: autonomous_loop
        run: |
          python backend/scripts/run_autonomous_learning_loop.py \
            --max-questions "$MAX_QUESTIONS" \
            --request-timeout "$REQUEST_TIMEOUT_SECONDS" \
            --attempts 1 \
            --report-path backend/rag/generated_autonomous_learning_loop_report.json

      - name: Upload autonomous learning report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autonomous-learning-loop-report
          path: backend/rag/generated_autonomous_learning_loop_report.json
          retention-days: 14

      - name: Propagate bounded autonomous result
        if: always()
        run: |
          if [ "${{ steps.autonomous_loop.outcome }}" = "success" ]; then
            echo "classification=PASS_BOUNDED_AUTONOMOUS_LEARNING_LOOP"
            exit 0
          fi
          echo "classification=CONFIGURATION_FAILURE"
          echo "originating_step=Run bounded autonomous learning loop"
          exit 1
