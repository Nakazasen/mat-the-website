name: Golden Oracle Regression Gate

on:
  schedule:
    # Run every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: golden-oracle-regression-production
  cancel-in-progress: false

jobs:
  run-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout codebase
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Preflight check for Supabase secrets
        run: |
          if [ -z "${{ secrets.SUPABASE_URL }}" ] || [ -z "${{ secrets.SUPABASE_KEY || secrets.SUPABASE_SERVICE_ROLE_KEY }}" ]; then
            echo "::error::Missing SUPABASE_URL or SUPABASE_KEY/SUPABASE_SERVICE_ROLE_KEY secret in repository secrets!"
            echo "Classification: BLOCKED_PHASE_11E4_MISSING_GITHUB_DB_SECRETS"
            echo "Please configure repository secrets SUPABASE_URL and SUPABASE_KEY/SUPABASE_SERVICE_ROLE_KEY."
            exit 1
          fi

      - name: Warm up production backend
        run: |
          python backend/scripts/warm_up_oracle_backend.py --base-url https://mat-the-website.onrender.com --attempts 5 --timeout 90 --backoff-seconds 10

      - name: Run static JSON regression
        id: run_json
        # Capture exit code so that we can upload artifacts even if this step fails
        continue-on-error: true
        run: |
          python backend/scripts/run_golden_oracle_regression_cases.py \
            --base-url https://mat-the-website.onrender.com \
            --source json \
            --request-timeout 75 \
            --infra-retries 3 \
            --infra-backoff-seconds 5 \
            --rollback-mode off \
            --report-path backend/rag/generated_golden_oracle_regression_report_json.json \
            --json \
            --write-report

      - name: Run dynamic DB regression
        id: run_db
        # Capture exit code so that we can upload artifacts even if this step fails
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY || secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python backend/scripts/run_golden_oracle_regression_cases.py \
            --base-url https://mat-the-website.onrender.com \
            --source db \
            --request-timeout 75 \
            --infra-retries 3 \
            --infra-backoff-seconds 5 \
            --rollback-mode off \
            --report-path backend/rag/generated_golden_oracle_regression_report_db.json \
            --json \
            --write-report \
            --write-db-run

      - name: Build combined summary
        if: always()
        run: |
          python -c '
          import os, json
          json_path = "backend/rag/generated_golden_oracle_regression_report_json.json"
          db_path = "backend/rag/generated_golden_oracle_regression_report_db.json"
          summary_path = "backend/rag/generated_golden_oracle_combined_summary.json"

          json_data = {}
          if os.path.exists(json_path):
              with open(json_path, "r", encoding="utf-8") as f:
                  json_data = json.load(f)

          db_data = {}
          if os.path.exists(db_path):
              with open(db_path, "r", encoding="utf-8") as f:
                  db_data = json.load(f)

          json_summary = json_data.get("summary", {})
          db_summary = db_data.get("summary", {})

          # Determine combined classification
          json_class = json_summary.get("failure_class", "none")
          db_class = db_summary.get("failure_class", "none")

          combined_class = "PASS_DUAL_SOURCE_GOLDEN_GATE"
          if json_class != "none" and db_class != "none":
              combined_class = "JSON_AND_DB_FAILURE"
          elif json_class == "semantic_failure":
              combined_class = "JSON_SEMANTIC_FAILURE"
          elif json_class == "infra_failure":
              combined_class = "JSON_INFRA_FAILURE"
          elif json_class == "configuration_failure":
              combined_class = "JSON_CONFIGURATION_FAILURE"
          elif db_class == "semantic_failure":
              combined_class = "DB_SEMANTIC_FAILURE"
          elif db_class == "infra_failure":
              combined_class = "DB_INFRA_FAILURE"
          elif db_class == "configuration_failure":
              combined_class = "DB_CONFIGURATION_FAILURE"

          combined = {
              "classification": combined_class,
              "json": {
                  "total": json_summary.get("total", 0),
                  "passed": json_summary.get("passed", 0),
                  "failed": json_summary.get("failed", 0),
                  "failure_class": json_class
              },
              "db": {
                  "total": db_summary.get("total", 0),
                  "passed": db_summary.get("passed", 0),
                  "failed": db_summary.get("failed", 0),
                  "failure_class": db_class,
                  "active_case_count": db_summary.get("total", 0),
                  "rollback_mode": db_summary.get("rollback_mode", "off"),
                  "rollback_performed": db_summary.get("rollback_performed", False)
              },
              "metadata": {
                  "production_git_commit": db_summary.get("production_git_commit") or json_summary.get("production_git_commit"),
                  "workflow_sha": os.getenv("GITHUB_SHA"),
                  "artifact_names": ["golden-regression-report-json", "golden-regression-report-db", "golden-regression-summary"]
              }
          }

          with open(summary_path, "w", encoding="utf-8") as f:
              json.dump(combined, f, indent=2, ensure_ascii=False)

          # Also append to GITHUB_STEP_SUMMARY
          step_summary = os.getenv("GITHUB_STEP_SUMMARY")
          if step_summary:
              with open(step_summary, "a", encoding="utf-8") as sf:
                  sf.write("### Dual-Source Combined Regression Summary\n")
                  sf.write(f"- **Combined Classification**: `{combined_class}`\n")
                  sf.write(f"- **JSON Source (Static Memory)**: {json_summary.get(\"passed\", 0)}/{json_summary.get(\"total\", 0)} passed\n")
                  sf.write(f"- **DB Source (Dynamic Registry)**: {db_summary.get(\"passed\", 0)}/{db_summary.get(\"total\", 0)} passed\n")
                  sf.write(f"- **Rollback Mode**: `{db_summary.get(\"rollback_mode\", \"off\")}`\n")
                  sf.write(f"- **Rollback Performed**: `{db_summary.get(\"rollback_performed\", False)}`\n")
          '

      - name: Upload JSON Regression Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: golden-regression-report-json
          path: backend/rag/generated_golden_oracle_regression_report_json.json
          retention-days: 14

      - name: Upload DB Regression Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: golden-regression-report-db
          path: backend/rag/generated_golden_oracle_regression_report_db.json
          retention-days: 14

      - name: Upload Combined Summary Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: golden-regression-summary
          path: backend/rag/generated_golden_oracle_combined_summary.json
          retention-days: 14

      - name: Propagate final exit code
        run: |
          EXIT_CODE=0
          if [ "${{ steps.run_json.outcome }}" != "success" ]; then
            echo "JSON regression run failed"
            EXIT_CODE=1
          fi
          if [ "${{ steps.run_db.outcome }}" != "success" ]; then
            echo "DB regression run failed"
            EXIT_CODE=1
          fi
          exit $EXIT_CODE
