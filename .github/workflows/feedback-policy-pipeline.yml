name: Feedback Policy Pipeline Cron

on:
  schedule:
    # Run every 1 hour (at minute 0)
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run pipeline in dry-run mode (no database writes)'
        type: boolean
        required: true
        default: true
      clear_cache:
        description: 'Clear Oracle answer cache on write'
        type: boolean
        required: true
        default: true
      limit:
        description: 'Maximum number of feedback records to process'
        type: number
        required: true
        default: 5000

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Determine parameters
        id: params
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "dry_run=${{ github.event.inputs.dry_run }}" >> $GITHUB_OUTPUT
            echo "clear_cache=${{ github.event.inputs.clear_cache }}" >> $GITHUB_OUTPUT
            echo "limit=${{ github.event.inputs.limit }}" >> $GITHUB_OUTPUT
          else
            # Default scheduled values (runs in active write mode by default on schedule)
            echo "dry_run=false" >> $GITHUB_OUTPUT
            echo "clear_cache=true" >> $GITHUB_OUTPUT
            echo "limit=5000" >> $GITHUB_OUTPUT
          fi

      - name: Call Pipeline Endpoint
        id: call_api
        run: |
          DRY_RUN="${{ steps.params.outputs.dry_run }}"
          CLEAR_CACHE="${{ steps.params.outputs.clear_cache }}"
          LIMIT="${{ steps.params.outputs.limit }}"
          
          echo "Executing pipeline with parameters:"
          echo "  dry_run: $DRY_RUN"
          echo "  clear_cache: $CLEAR_CACHE"
          echo "  limit: $LIMIT"
          
          HTTP_STATUS=$(curl -s -X POST "https://mat-the-website.onrender.com/oracle/admin/run-feedback-policy-pipeline" \
            -H "Content-Type: application/json" \
            -H "X-Oracle-Pipeline-Cron-Token: ${{ secrets.ORACLE_FEEDBACK_PIPELINE_CRON_TOKEN }}" \
            -d "{\"dry_run\": $DRY_RUN, \"clear_cache\": $CLEAR_CACHE, \"limit\": $LIMIT}" \
            -w "%{http_code}" \
            -o response.json)
          
          echo "HTTP Status Code: $HTTP_STATUS"
          
          if [ -f response.json ]; then
            echo "Response Body:"
            cat response.json | jq '.' || cat response.json
          else
            echo "No response body returned."
          fi
          
          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "Error: API call failed with status code $HTTP_STATUS"
            exit 1
          fi
          
          OK_FLAG=$(jq -r '.ok' response.json 2>/dev/null || echo "false")
          if [ "$OK_FLAG" != "true" ]; then
            echo "Error: Pipeline report indicated unsuccessful execution ('ok' is not true)."
            exit 1
          fi
          
          echo "Pipeline executed successfully!"
